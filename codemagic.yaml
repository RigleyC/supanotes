workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Caches/org.swift.swiftpm
        - ios/Pods
        - DerivedData
    environment:
      groups:
        - api_config
      vars:
        API_BASE_URL: "https://backend-winter-waterfall-5807.fly.dev/api/v1"
        GOOGLE_SERVICE_INFO_B64: ""
      flutter: 3.44.1
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'master'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Decode GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Calculate app version
        script: |
          set -eu
          git fetch --tags --force
          VERSION_OUTPUT="$(dart run scripts/app_version.dart --build-number "${BUILD_NUMBER:?BUILD_NUMBER env var is required}")"
          APP_VERSION="$(printf '%s\n' "$VERSION_OUTPUT" | sed -n 's/^APP_VERSION=//p' | tail -n 1)"
          APP_BUILD_NUMBER="$(printf '%s\n' "$VERSION_OUTPUT" | sed -n 's/^APP_BUILD_NUMBER=//p' | tail -n 1)"
          if [ -z "$APP_VERSION" ] || [ -z "$APP_BUILD_NUMBER" ]; then
            echo "ERROR: failed to extract app version from output:"
            printf '%s\n' "$VERSION_OUTPUT"
            exit 1
          fi
          echo "Building SupaNotes $APP_VERSION+$APP_BUILD_NUMBER"
          echo "APP_VERSION=$APP_VERSION" >> "$CM_ENV"
          echo "APP_BUILD_NUMBER=$APP_BUILD_NUMBER" >> "$CM_ENV"
      - name: Install pods
        script: |
          cd ios && pod install && cd ..
      - name: Flutter build config-only
        script: |
          flutter build ios --config-only --no-codesign \
            --build-name="$APP_VERSION" \
            --build-number="$APP_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
      - name: Build iOS project with xcodebuild
        script: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ../DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            FLUTTER_BUILD_NAME="$APP_VERSION" \
            FLUTTER_BUILD_NUMBER="$APP_BUILD_NUMBER" \
            FLUTTER_BUILD_EXTRA_FRONT_END_OPTIONS="--dart-define=API_BASE_URL=$API_BASE_URL" \
            build
      - name: Package Unsigned IPA
        script: |
          set -eu
          APP_PATH=$(find DerivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Could not find .app"
            exit 1
          fi

          # Impactor provisions capabilities from entitlements embedded in the
          # executable. CODE_SIGNING_ALLOWED=NO leaves no entitlement blob, so
          # add a replaceable ad-hoc signature before packaging the IPA.
          EXTENSION_PATH="$APP_PATH/PlugIns/ShareExtension.appex"
          if [ ! -d "$EXTENSION_PATH" ]; then
            echo "Error: Could not find ShareExtension.appex"
            exit 1
          fi
          codesign --force --sign - \
            --entitlements ios/ImpactorBootstrap.entitlements \
            "$EXTENSION_PATH"
          codesign --force --sign - \
            --entitlements ios/ImpactorBootstrap.entitlements \
            "$APP_PATH"

          for BUNDLE_PATH in "$APP_PATH" "$EXTENSION_PATH"; do
            ENTITLEMENTS=$(codesign --display --entitlements :- "$BUNDLE_PATH" 2>/dev/null)
            if ! printf '%s' "$ENTITLEMENTS" | grep -Fq '<string>group.com.supanotes.shared</string>'; then
              echo "Error: $BUNDLE_PATH does not embed the shared App Group"
              exit 1
            fi
          done

          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -rq supanotes-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - build/supanotes-unsigned.ipa

  ios-signed:
    name: iOS Signed Release IPA
    max_build_duration: 60
    instance_type: mac_mini_m1
    cache:
      cache_paths:
        - $FLUTTER_ROOT/.pub-cache
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - $HOME/Library/Developer/Xcode/DerivedData
    environment:
      groups:
        - api_config
        - app_store_credentials
      vars:
        API_BASE_URL: "https://backend-winter-waterfall-5807.fly.dev/api/v1"
        GOOGLE_SERVICE_INFO_B64: "base64-encoded-GoogleService-Info.plist"
        APP_STORE_APP_ID: 6440000000
      flutter: 3.44.1
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'release/*'
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Decode GoogleService-Info.plist
        script: |
          echo "$GOOGLE_SERVICE_INFO_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
      - name: Flutter pub get
        script: |
          flutter pub get
      - name: Calculate app version
        script: |
          set -eu
          git fetch --tags --force
          VERSION_OUTPUT="$(dart run scripts/app_version.dart --build-number "${BUILD_NUMBER:?BUILD_NUMBER env var is required}")"
          APP_VERSION="$(printf '%s\n' "$VERSION_OUTPUT" | sed -n 's/^APP_VERSION=//p' | tail -n 1)"
          APP_BUILD_NUMBER="$(printf '%s\n' "$VERSION_OUTPUT" | sed -n 's/^APP_BUILD_NUMBER=//p' | tail -n 1)"
          if [ -z "$APP_VERSION" ] || [ -z "$APP_BUILD_NUMBER" ]; then
            echo "ERROR: failed to extract app version from output:"
            printf '%s\n' "$VERSION_OUTPUT"
            exit 1
          fi
          echo "Building SupaNotes $APP_VERSION+$APP_BUILD_NUMBER"
          echo "APP_VERSION=$APP_VERSION" >> "$CM_ENV"
          echo "APP_BUILD_NUMBER=$APP_BUILD_NUMBER" >> "$CM_ENV"
      - name: Install pods
        script: |
          cd ios && pod install && cd ..
      - name: Set up keychain
        script: |
          keychain initialize
      - name: Fetch signing certificates and profiles
        script: |
          app-store-connect fetch-signing-files "com.rigley.supanotes" \
            --issuer-id "$APP_STORE_CONNECT_ISSUER_ID" \
            --key-id "$APP_STORE_CONNECT_KEY_IDENTIFIER" \
            --private-key "$APP_STORE_CONNECT_PRIVATE_KEY" \
            --certificate-key "$APP_STORE_CONNECT_CERTIFICATE_PRIVATE_KEY" \
            --create
      - name: Use profiles
        script: |
          xcode-project use-profiles
      - name: Write export options
        script: |
          cat > export_options.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>compileBitcode</key>
              <false/>
          </dict>
          </plist>
          PLIST
      - name: Build signed IPA
        script: |
          flutter build ipa --release \
            --build-name="$APP_VERSION" \
            --build-number="$APP_BUILD_NUMBER" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --export-options-plist=export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
