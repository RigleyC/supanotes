name: Editor Empty Task Regression

on:
  push:
    branches: [fix/editor-empty-task-delete]
    paths:
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/editor-empty-task-test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Flutter test
        run: flutter test
