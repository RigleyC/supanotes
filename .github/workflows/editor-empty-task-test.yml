name: Editor Empty Task Regression

on:
  push:
    branches: [fix/editor-empty-task-delete]
    paths:
      - lib/**
      - test/features/notes/editor/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/editor-empty-task-test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Run editor regression test
        run: flutter test test/features/notes/editor/document/empty_task_deletion_policy_test.dart
