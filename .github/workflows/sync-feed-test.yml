name: Sync Feed Regression

on:
  push:
    branches: [feat/sync-coordinator-outbox-inbox]
    paths:
      - backend/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/sync-feed-test.yml

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: backend/go.sum
      - run: go test -count=1 ./internal/syncfeed ./internal/noteoperations

  flutter-inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter test
          test/core/sync/sync_inbox_store_test.dart
          test/core/sync/sync_inbox_worker_test.dart
          test/core/sync/note_operations_materialized_projection_test.dart
          test/core/sync/note_remote_sync_coordinator_test.dart
