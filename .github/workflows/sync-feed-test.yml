name: Sync Full Verification

on:
  push:
    branches: [feat/sync-coordinator-outbox-inbox]
    paths:
      - backend/**
      - lib/**
      - test/**
      - pubspec.yaml
      - pubspec.lock
      - .github/workflows/sync-feed-test.yml

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supanotes
          POSTGRES_PASSWORD: supanotes
          POSTGRES_DB: supanotes_sync_feed
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U supanotes"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SUPANOTES_SYNC_TEST_DATABASE_URL: postgres://supanotes:supanotes@localhost:5432/supanotes_sync_feed?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: backend/go.sum
      - run: go test -count=1 ./internal/syncfeed ./internal/noteoperations

  backend-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.0'
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go build ./...
      - run: go test -count=1 -short ./...

  flutter-focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >-
          flutter test
          test/core/sync/sync_inbox_store_test.dart
          test/core/sync/sync_inbox_worker_test.dart
          test/core/sync/note_operations_materialized_projection_test.dart
          test/core/sync/note_remote_sync_coordinator_test.dart
          test/core/sync/multi_device_sync_e2e_test.dart
          test/features/notes/catalog/data/remote_note_change_applier_test.dart
          test/features/notes/catalog/data/note_catalog_sync_provider_test.dart

  flutter-full:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test core
        if: always()
        run: flutter test test/core
      - name: Test auth
        if: always()
        run: flutter test test/features/auth
      - name: Test notes
        if: always()
        run: flutter test test/features/notes
      - name: Test settings
        if: always()
        run: flutter test test/features/settings
      - name: Test tasks
        if: always()
        run: flutter test test/features/tasks
      - name: Test shared
        if: always()
        run: flutter test test/shared
      - name: Test root widget
        if: always()
        run: flutter test test/widget_test.dart
