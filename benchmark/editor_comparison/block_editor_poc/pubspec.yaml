name: block_editor_poc
publish_to: none
environment:
  sdk: ">=3.13.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  block_editor: 0.0.4-dev.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  editor_harness:
    path: ../harness
dependency_overrides:
  # block_editor 0.0.4-dev.1 does not compile on Flutter 3.47 (missing
  # TextInputClient.onFocusReceived). vendor/block_editor is the pub.dev
  # tarball plus one added method; see test/benchmark_test.dart header.
  block_editor:
    path: vendor/block_editor
